<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Início · SEMPER</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/estilo.css">
</head>
<body>
<div class="topo-cel" id="topoCel"></div>
<div class="app">
  <aside class="side" id="side" aria-label="Menu"></aside>
  <main class="conteudo">
    <div class="miolo" id="miolo"><p class="carregando">Carregando…</p></div>
  </main>
</div>

<script src="../assets/marca.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/dados.js"></script>
<script src="../assets/pessoa.js"></script>
<script src="../assets/comum.js"></script>
<script>
(async function () {
  const { esc, url, avatares, montarCasca, exigirLogin, titulo, relativo, falha, avisar, ocupado } = window.UI;
  const ctx = await exigirLogin();
  montarCasca('inicio', ctx);
  titulo('Início');
  const miolo = document.getElementById('miolo');

  let r;
  try { r = await SD.pessoasResumo(); }
  catch (e) { miolo.innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`; return; }

  const primeiro = (ctx.perfil.nome || '').trim().split(/\s+/)[0];
  const fmt = n => n.toLocaleString('pt-BR');
  miolo.innerHTML = `
    <header>
      <p class="olho">${esc(ctx.escritorio?.nome || '')}</p>
      <h1 class="titulo">Olá${primeiro ? ', ' + esc(primeiro) : ''}<span class="ponto">.</span></h1>
    </header>

    <section class="destaque" aria-labelledby="tAtalho">
      <div style="flex:1 1 360px;min-width:0">
        <h2 id="tAtalho">Comece por aqui</h2>
        <p>${r.total ? 'Cadastre uma pessoa nova ou acompanhe o atendimento no quadro.' : 'Cadastre a primeira pessoa do escritório.'}</p>
      </div>
      <div class="acoes">
        <a class="btn" href="${url('pessoas/?visao=kanban')}">Ver o quadro</a>
        <a class="btn pri" href="${url('pessoas/nova/')}">Cadastrar pessoa</a>
      </div>
    </section>

    <section aria-labelledby="tNum" style="display:flex;flex-direction:column;gap:14px">
      <h2 class="secao" id="tNum">Pessoas</h2>
      <div class="resumo">
        <a class="cartao" href="${url('pessoas/')}"><b>${fmt(r.total)}</b><span>No escritório</span></a>
        <a class="cartao" href="${url('pessoas/?responsavel=eu')}"><b>${fmt(r.minhas)}</b><span>Sob sua responsabilidade</span></a>
        <div class="cartao"><b>${fmt(r.mes)}</b><span>Cadastradas neste mês</span></div>
        <a class="cartao" href="${url('pessoas/?situacao=arquivadas')}"><b>${fmt(r.arquivadas)}</b><span>Arquivadas</span></a>
      </div>
    </section>

    <section aria-labelledby="tRec" style="display:flex;flex-direction:column;gap:14px">
      <div class="secao-topo">
        <h2 class="secao" id="tRec">Atualizadas recentemente</h2>
        <a class="link" href="${url('pessoas/')}">Ver todas</a>
      </div>
      ${r.recentes.length ? `<div class="tabela"><table style="min-width:560px">
        <thead><tr><th scope="col">Pessoa</th><th scope="col">Contato</th><th scope="col">Responsáveis</th><th scope="col">Atualizada</th></tr></thead>
        <tbody>${r.recentes.map(p => `<tr class="clicavel" data-id="${p.id}">
          <td><div class="nome">${esc(p.nome)}</div><div class="sub">${esc(PES.TIPOS[p.tipo])}${p.documento ? ' · ' + esc(PES.fmtDocumento(p.documento)) : ''}</div></td>
          <td>${esc(PES.fmtTelefone(p.telefones?.[0] || ''))}</td>
          <td>${avatares(p.resp.map(x => x.perfil_id), ctx.equipe)}</td>
          <td style="white-space:nowrap;color:var(--muted)">${relativo(p.atualizado_em)}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="vazio">Nenhuma pessoa cadastrada ainda. <a class="link" href="${url('pessoas/nova/')}">Cadastrar a primeira</a></div>`}
    </section>

    <section id="conta" aria-labelledby="tConta" style="display:flex;flex-direction:column;gap:14px">
      <h2 class="secao" id="tConta">Minha conta</h2>
      <div class="cartao campos" style="display:flex;flex-direction:column;gap:16px">
        <p class="nota">E-mail de acesso: <b style="color:var(--ink)">${esc(ctx.usuario.email)}</b></p>
        <form id="fConta" class="grade-campos" style="align-items:end">
          <label>Nome<input id="cNome" value="${esc(ctx.perfil.nome)}" required></label>
          <label>Usuário para menções <small>(@nome nas conversas)</small><input id="cUsuario" value="${esc(ctx.perfil.usuario)}" required></label>
          <div><button class="btn esc" type="submit">Salvar</button></div>
        </form>
      </div>
    </section>`;

  miolo.querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => { location.href = url('pessoas/?id=' + tr.dataset.id); });

  document.getElementById('fConta').onsubmit = async e => {
    e.preventDefault();
    const nome = cNome.value.trim().replace(/\s+/g, ' ');
    const usuario = cUsuario.value.trim().toLowerCase().replace(/^@/, '');
    if (!nome) return falha(new Error('Informe seu nome.'));
    if (!/^[a-z0-9._-]{2,40}$/.test(usuario)) return falha(new Error('O usuário aceita letras sem acento, números, ponto, hífen e sublinhado (2 a 40).'));
    const btn = e.target.querySelector('button');
    ocupado(btn, true);
    try {
      await SD.salvarPerfil({ nome, usuario });
      montarCasca('inicio', ctx);
      avisar('Conta atualizada.');
    } catch (err) {
      falha(/duplicate|existe/i.test(err.message) ? new Error('Esse @usuário já é usado por outra pessoa do escritório.') : err);
    }
    ocupado(btn, false);
  };
  if (location.hash === '#conta') document.getElementById('conta').scrollIntoView();
})();
</script>
</body>
</html>
