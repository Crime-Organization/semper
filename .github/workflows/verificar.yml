name: Verificar o SEMPER

# A cada envio ao main e a cada pull request, confere os tipos, roda os testes (unitários, de componente
# e de ponta a ponta) e compila o React.
# Não publica nada: o site só muda quando sai uma versão nova (veja publicar.yml).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar
        working-directory: app
        run: npm ci

      - name: Conferir tipos e testes
        working-directory: app
        run: npm run verificar

      - name: Instalar o navegador dos testes de ponta a ponta
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        working-directory: app
        run: npm run testar-telas

      - name: Guardar o relatório dos testes de ponta a ponta
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: app/playwright-report/
          retention-days: 14

      - name: Compilar
        working-directory: app
        run: npx vite build
