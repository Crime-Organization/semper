name: Verificar o SEMPER

# A cada envio ao main e a cada pull request, roda os testes (testes.yml) e, só se todos passarem, compila o React.
# Não publica nada: o site só muda quando sai uma versão nova (veja publicar.yml).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes
    uses: ./.github/workflows/testes.yml

  compilar:
    name: Compilar
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/preparar

      - name: Compilar
        working-directory: app
        run: npx vite build
