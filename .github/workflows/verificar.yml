name: Verificar o SEMPER

# A cada pull request, roda os testes (testes.yml) e, só se todos passarem, compila o React. O envio direto ao main não dispara nada, para
# poupar os minutos do GitHub: quem envia já passou nos testes do computador (.githooks/pre-push), e a publicação roda todos de novo (publicar.yml).
# Não publica nada: o site só muda quando sai uma versão nova.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes
    uses: ./.github/workflows/testes.yml

  compilar:
    name: Compilar
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/preparar

      - name: Compilar
        working-directory: app
        run: npx vite build
