name: Publicar o SEMPER

# Põe uma versão no ar. Cada versão é uma marca vX.Y.Z no commit que foi publicado.
#
# - Versão nova: Actions → Publicar o SEMPER → Run workflow (no main), escolhendo o tipo de mudança.
#   O número sai sozinho a partir da última marca (v1.2.3 → correção v1.2.4, novidade v1.3.0,
#   grande v2.0.0; a primeira é v1.0.0).
# - Também dá para criar a marca à mão: git tag v1.2.4 && git push origin v1.2.4.
# - Voltar atrás: Run workflow preenchendo "versao" com uma marca que já existe (ex.: v1.2.3).
#   (A versão é testada e compilada com as próprias rotinas e a ação .github/actions/preparar, que existem desde a v1.0.0.)
#
# Três etapas: escolhe a versão, roda os testes (testes.yml) nesse mesmo commit e, só se todos passarem, compila,
# cria a marca e a versão no GitHub e grava o site pronto no ramo "publicacao", que é o que a Hostinger coloca no ar.
# Se algo falhar, nenhuma marca é criada, nada é publicado e o site continua como estava.
#
# Novidades (#353): o site mostra as de app/novidades/proxima/ com o número e a data desta versão. Depois de publicar,
# a última etapa passa esses arquivos para app/novidades/vX.Y.Z/ no main (um commit do github-actions), para a versão
# seguinte não os mostrar como dela.
on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Tipo de mudança da versão nova'
        type: choice
        options: [correção, novidade, grande]
        default: correção
      versao:
        description: 'Ou republicar uma versão que já existe (ex.: v1.2.3), para voltar atrás'
        required: false
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  versao:
    name: Escolher a versão
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      commit: ${{ steps.versao.outputs.commit }}
      data: ${{ steps.versao.outputs.data }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.versao || github.ref }}
          fetch-depth: 0

      - name: Escolher a versão
        id: versao
        env:
          TIPO: ${{ inputs.tipo }}
          PEDIDA: ${{ inputs.versao }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            VERSAO="$GITHUB_REF_NAME"
          elif [ -n "$PEDIDA" ]; then
            git rev-parse -q --verify "refs/tags/$PEDIDA" >/dev/null || { echo "::error::A versão $PEDIDA não existe."; exit 1; }
            VERSAO="$PEDIDA"
          else
            if [ "$GITHUB_REF" != refs/heads/main ]; then echo "::error::Versão nova só sai do main."; exit 1; fi
            JA=$(git tag --points-at HEAD --list 'v*.*.*' | head -1)
            if [ -n "$JA" ]; then echo "::error::Este commit já é a versão $JA. Para republicá-la, preencha \"versao\"."; exit 1; fi
            ULTIMA=$(git tag --list 'v*.*.*' --sort=-v:refname | head -1)
            if [ -z "$ULTIMA" ]; then
              VERSAO=v1.0.0
            else
              IFS=. read -r MAIOR MENOR CORRECAO <<< "${ULTIMA#v}"
              case "$TIPO" in
                grande)   VERSAO="v$((MAIOR + 1)).0.0" ;;
                novidade) VERSAO="v$MAIOR.$((MENOR + 1)).0" ;;
                *)        VERSAO="v$MAIOR.$MENOR.$((CORRECAO + 1))" ;;
              esac
            fi
          fi
          [[ "$VERSAO" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::\"$VERSAO\" não é uma versão no formato v1.2.3."; exit 1; }
          # A data da versão, no horário de Brasília, que aparece nas Novidades (#353). Ao voltar atrás, a da marca (a que
          # esta rotina cria é anotada: a data é a da publicação). Numa versão nova, ou numa marca criada à mão agora (que
          # pode ser leve, com a data do commit, de dias antes), a de hoje.
          if [ -n "$PEDIDA" ]; then
            DATA=$(TZ=America/Sao_Paulo git for-each-ref --format='%(creatordate:format-local:%Y-%m-%d)' "refs/tags/$VERSAO")
          else
            DATA=$(TZ=America/Sao_Paulo date +%F)
          fi
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "data=$DATA" >> "$GITHUB_OUTPUT"
          echo "Versão: $VERSAO ($(git rev-parse --short HEAD))"

  testes:
    name: Testes
    needs: versao
    uses: ./.github/workflows/testes.yml
    with:
      ref: ${{ needs.versao.outputs.commit }}

  publicar:
    name: Compilar e publicar
    needs: [versao, testes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.versao.outputs.commit }}
          fetch-depth: 0

      - uses: ./.github/actions/preparar

      - name: Compilar
        working-directory: app
        env:
          VERSAO: ${{ needs.versao.outputs.versao }}
          DATA_DA_VERSAO: ${{ needs.versao.outputs.data }}
        run: |
          # O VERSAO também entra no código (vite.config.ts): a aba aberta compara com o versao.txt e avisa da versão nova.
          # Com o DATA_DA_VERSAO, as novidades de app/novidades/proxima/ aparecem com o número e a data desta versão.
          npx vite build
          # Para conferir o que está no ar: https://semper.app.br/versao.txt
          printf '%s %s\n' "$VERSAO" "$(git rev-parse --short HEAD)" > dist/versao.txt

      - name: Marcar a versão
        env:
          VERSAO: ${{ needs.versao.outputs.versao }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse -q --verify "refs/tags/$VERSAO" >/dev/null; then
            git tag -a "$VERSAO" -m "SEMPER $VERSAO"
            git push origin "$VERSAO"
          fi
          if ! gh release view "$VERSAO" >/dev/null 2>&1; then
            ANTERIOR=$(git describe --tags --abbrev=0 --match 'v*.*.*' "$VERSAO^" 2>/dev/null || true)
            git log --no-merges --format='- %s' ${ANTERIOR:+"$ANTERIOR.."}"$VERSAO" > ../notas.md
            gh release create "$VERSAO" --verify-tag --title "SEMPER $VERSAO" --notes-file ../notas.md
          fi

      - name: Publicar no ramo publicacao
        env:
          VERSAO: ${{ needs.versao.outputs.versao }}
        run: |
          set -euo pipefail
          ORIGEM=$(git rev-parse --short HEAD)
          git fetch origin publicacao
          git worktree add -B publicacao ../publicacao origin/publicacao
          cd ../publicacao
          git rm -r -q --ignore-unmatch .
          cp -a "$GITHUB_WORKSPACE/app/dist/." .
          git add -A
          if git diff --cached --quiet; then echo "Nada mudou no site."; exit 0; fi
          git commit -q -m "SEMPER $VERSAO" -m "Publicação de $ORIGEM"
          git push origin publicacao

      - name: Carimbar as novidades
        # As novidades desta versão estavam em app/novidades/proxima/ (quem escreve a mudança ainda não sabe o número).
        # O site que acabou de ir ao ar já as mostra com o número e a data desta versão; aqui elas passam, no main, para
        # app/novidades/vX.Y.Z/ (com a data em versao.json), para a versão seguinte não as mostrar como dela (#353).
        # Só passam as que estavam no commit publicado: o que entrou no main depois continua em "proxima".
        # Voltar atrás (republicar uma versão) não muda nada. Se esta etapa falhar, o site já está no ar: mova os
        # arquivos à mão, do mesmo jeito, antes da próxima publicação.
        if: ${{ !inputs.versao }}
        env:
          VERSAO: ${{ needs.versao.outputs.versao }}
          DATA: ${{ needs.versao.outputs.data }}
          COMMIT: ${{ needs.versao.outputs.commit }}
        run: |
          set -euo pipefail
          PASTA=app/novidades
          NESTA=$(git ls-tree --name-only "$COMMIT" "$PASTA/proxima/" | grep '\.json$' || true)
          if [ -z "$NESTA" ]; then echo "Nenhuma novidade nesta versão."; exit 0; fi
          git fetch origin main
          git worktree add -B carimbo ../carimbo origin/main
          cd ../carimbo
          if [ -e "$PASTA/$VERSAO" ]; then echo "As novidades da $VERSAO já estão na pasta dela."; exit 0; fi
          mkdir -p "$PASTA/$VERSAO"
          MOVIDAS=0
          for ARQUIVO in $NESTA; do
            if [ -f "$ARQUIVO" ]; then git mv "$ARQUIVO" "$PASTA/$VERSAO/"; MOVIDAS=$((MOVIDAS + 1)); fi
          done
          if [ "$MOVIDAS" -eq 0 ]; then echo "As novidades desta versão já saíram da pasta proxima."; exit 0; fi
          printf '{\n  "data": "%s"\n}\n' "$DATA" > "$PASTA/$VERSAO/versao.json"
          git add "$PASTA/$VERSAO/versao.json"
          git commit -q -m "Novidades da $VERSAO" -m "As $MOVIDAS novidades publicadas na $VERSAO saem de $PASTA/proxima/ para $PASTA/$VERSAO/ (#353)."
          # Se alguém enviou ao main enquanto isso, junta e tenta de novo. Sem o gancho de antes do envio (.githooks/pre-push):
          # ele roda o npm run verificar, que aqui não tem as dependências (esta pasta é só o main, sem npm ci), e o commit só
          # move arquivos de novidades que os testes desta mesma rotina já conferiram, mais o versao.json escrito acima.
          for TENTATIVA in 1 2 3; do
            if git -c core.hooksPath=/dev/null push origin HEAD:main; then exit 0; fi
            # Se o junte der conflito, desfaz e cai no aviso abaixo, que diz como fazer à mão (sem isto, o set -e parava aqui).
            git pull -q --rebase origin main || { git rebase --abort || true; break; }
          done
          echo "::error::Não deu para enviar ao main a mudança das novidades da $VERSAO. O site está no ar; mova à mão os arquivos de $PASTA/proxima/ publicados para $PASTA/$VERSAO/."
          exit 1
