name: Testes do SEMPER

# Os testes do SEMPER num lugar só. As rotinas verificar.yml (cada envio e pull request) e publicar.yml
# (cada versão) chamam esta e só compilam ou publicam se todos os jobs daqui passarem.
# Três jobs em paralelo: tipos e lint, unitários e componentes, e ponta a ponta.
# Também dá para rodar à mão em qualquer ramo: Actions → Testes do SEMPER → Run workflow.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit, ramo ou marca a testar (vazio: o que disparou a rotina)'
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Tipos e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar
        working-directory: app
        run: npm ci

      - name: Conferir os tipos
        working-directory: app
        run: npm run tipos

      - name: Lint
        working-directory: app
        run: npm run lint -- --format github

  unitarios:
    name: Unitários e componentes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar
        working-directory: app
        run: npm ci

      - name: Testes unitários e de componente
        working-directory: app
        run: npm run testar

  ponta-a-ponta:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar
        working-directory: app
        run: npm ci

      - name: Instalar o navegador
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        working-directory: app
        run: npm run testar-telas

      - name: Guardar o relatório
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: app/playwright-report/
          retention-days: 14
