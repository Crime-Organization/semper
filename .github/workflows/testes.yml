name: Testes do SEMPER

# Os testes do SEMPER num lugar só. As rotinas verificar.yml (cada envio e pull request) e publicar.yml
# (cada versão) chamam esta e só compilam ou publicam se todos os jobs daqui passarem.
# Quatro jobs em paralelo: tipos e lint, unitários e componentes, ponta a ponta, e banco.
# Também dá para rodar à mão em qualquer ramo: Actions → Testes do SEMPER → Run workflow.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit, ramo ou marca a testar (vazio: o que disparou a rotina)'
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Tipos e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/preparar

      - name: Conferir os tipos
        working-directory: app
        run: npm run tipos

      - name: Lint
        working-directory: app
        run: npm run lint -- --format github

  unitarios:
    name: Unitários e componentes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/preparar

      - name: Testes unitários e de componente
        working-directory: app
        run: npm run testar

  # Sobe um banco vazio na própria máquina da rotina: sem segredo nenhum e sem acesso à produção.
  banco:
    name: Banco (migrações e regras de acesso)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Aplicar as migrações do zero
        run: supabase db start

      - name: Testes do banco
        run: supabase test db

      - name: Instalar o programa que criptografa
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      # Com dados inventados: copia, confere a criptografia, apaga, restaura e confere os dados e as regras de acesso.
      - name: Cópia de segurança e restauração
        run: supabase/copia/testar-restauracao.sh

  ponta-a-ponta:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/preparar

      - name: Instalar o navegador
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        working-directory: app
        run: npm run testar-telas

      - name: Guardar o relatório
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: app/playwright-report/
          retention-days: 14
