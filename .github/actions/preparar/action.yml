name: Preparar o SEMPER
description: Node 24 com o cache do npm e as dependências do app instaladas (npm ci). Vem depois do checkout.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: app/package-lock.json

    - name: Instalar
      shell: bash
      working-directory: app
      run: npm ci
